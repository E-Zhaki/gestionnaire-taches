<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestionnaire de tâches</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>Gestionnaire de tâches</h1>
    </header>

    <main>
        <form id="task-form">
            <label for="titre">Titre *</label>
            <input type="text" id="titre">
            <label for="description">Description</label>
            <textarea id="description"></textarea>
            <label for="statut">Statut</label>
            <select id="statut">
                <option value="à faire">À faire</option>
                <option value="en cours">En cours</option>
                <option value="terminée">Terminée</option>
                <option value="bloquée">Bloquée</option>
            </select>
                <label for="priorite">Priorité</label>
                <select id="priorite">
                    <option value="haute">Haute</option>
                    <option value="moyenne" selected>Moyenne</option>
                    <option value="basse">Basse</option>
                </select>

            <p id="form-error"></p>
            <button type="submit">Ajouter</button>
        </form>
        <section id="outils">
            <label for="filtre">Filtrer</label>
            <select id="filtre">
                <option value="toutes">toutes</option>
                <option value="à faire">À faire</option>
                <option value="en cours">En cours</option>
                <option value="terminée">Terminée</option>
                <option value="bloquée">Bloquée</option>
            </select>
            <label for="filtre-priorite">Filtrer par priorité</label>
            <select id="filtre-priorite">
                <option value="toutes">Toutes</option>
                <option value="haute">Haute</option>
                <option value="moyenne">Moyenne</option>
                <option value="basse">Basse</option>
            </select>

            <label for="tri">Trier</label>
            <select id="tri">
                <option value="manuel">Ordre manuel</option>
                <option value="priorite">Par priorité</option>
            </select>

            <label for="recherche">Rechercher</label>
            <input type="text" id="recherche">
        </section>
        <div id="stats"></div>

        <p id="empty-message">Aucune tâche pour le moment.</p>
        <div id="task-list"></div>
    </main>
    <script src="js/script.js"></script>
</body>
</html>
